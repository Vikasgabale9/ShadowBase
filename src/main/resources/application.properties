spring.application.name=shadowbase

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shadowbase_app}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=${SERVER_PORT:8080}

#jwt
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# Shadow Database Configuration
shadowbase.shadow-db.admin-url=${SHADOW_DB_ADMIN_URL}
shadowbase.shadow-db.username=${SHADOW_DB_USERNAME}
shadowbase.shadow-db.password=${SHADOW_DB_PASSWORD}
shadowbase.shadow-db.database-prefix=shadowbase_shadow_


# Shadow Schema Initialization
shadowbase.schema-initialization.pg-dump-path=pg_dump
shadowbase.schema-initialization.psql-path=psql